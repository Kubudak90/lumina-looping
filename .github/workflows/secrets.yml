# Secret scanning (OPS-02): gitleaks over the full git history with the repo .gitleaks.toml.
# Same job as lumina-monorepo/.github/workflows/ci.yml (pinned, sha256-verified gitleaks; config
# self-test; --redact). Findings are printed redacted.
name: Secrets

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (release checksums file, re-hashed locally)
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, sha256-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Config self-test (a fake 64-hex key is caught, a plain address is not)
        run: |
          set -euo pipefail
          gitleaks version
          fx="$(mktemp -d "$RUNNER_TEMP/gl-selftest.XXXXXX")"
          mkdir -p "$fx/leak" "$fx/clean"
          # Built at run time so no key-shaped literal is ever committed.
          fake="$(printf 'deadbeef%.0s' 1 2 3 4 5 6 7 8)"
          printf 'PRIVATE_KEY=0x%s\n' "$fake" > "$fx/leak/with-0x.env"
          printf 'deployer_pk: "%s"\n' "$fake" > "$fx/leak/without-0x.yml"
          printf 'owner_api_key = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"\nADMIN_ADDRESS=0x70997970C51812dc3A010C7d01b50e0d17dc79C8\n' > "$fx/clean/addresses.env"
          set +e
          gitleaks dir "$fx/leak" --config .gitleaks.toml --redact --no-banner --log-level error \
            --exit-code 3 --report-format json --report-path "$fx/leak.json"
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then echo "::error::self-test: fake keys were not detected (exit $status)"; exit 1; fi
          if [ "$(jq '[.[] | select(.RuleID == "evm-private-key")] | length' "$fx/leak.json")" -ne 2 ]; then
            echo "::error::self-test: evm-private-key must flag both fake keys"; exit 1
          fi
          gitleaks dir "$fx/clean" --config .gitleaks.toml --redact --no-banner --log-level error --exit-code 3
          echo "self-test passed: fake keys caught, plain addresses ignored"
      - name: Scan the full git history (all fetched refs)
        run: |
          set -euo pipefail
          # No inline `gitleaks:allow` and no .gitleaksignore: only .gitleaks.toml can allowlist.
          mkdir -p "$RUNNER_TEMP/no-gitleaksignore"
          gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="--all" --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaksignore"
