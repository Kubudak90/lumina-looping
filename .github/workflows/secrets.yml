# Secret scanning (OPS-02): gitleaks over the full git history with the repo .gitleaks.toml.
# Same job as lumina-monorepo/.github/workflows/ci.yml (pinned, sha256-verified gitleaks; config
# and merge-commit self-tests; --redact). Findings are printed redacted.
# Runs on every push to any branch and on every PR, so each pushed commit is scanned, including
# commits a monorepo PR points a submodule at.
name: Secrets

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (release checksums file, re-hashed locally)
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned version, sha256-verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Config self-test (a fake 64-hex key is caught, a plain address is not)
        run: |
          set -euo pipefail
          gitleaks version
          fx="$(mktemp -d "$RUNNER_TEMP/gl-selftest.XXXXXX")"
          mkdir -p "$fx/leak" "$fx/clean"
          # Built at run time so no key-shaped literal is ever committed.
          fake="$(printf 'deadbeef%.0s' 1 2 3 4 5 6 7 8)"
          printf 'PRIVATE_KEY=0x%s\n' "$fake" > "$fx/leak/with-0x.env"
          printf 'deployer_pk: "%s"\n' "$fake" > "$fx/leak/without-0x.yml"
          printf 'owner_api_key = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"\nADMIN_ADDRESS=0x70997970C51812dc3A010C7d01b50e0d17dc79C8\n' > "$fx/clean/addresses.env"
          set +e
          gitleaks dir "$fx/leak" --config .gitleaks.toml --redact --no-banner --log-level error \
            --exit-code 3 --report-format json --report-path "$fx/leak.json"
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then echo "::error::self-test: fake keys were not detected (exit $status)"; exit 1; fi
          if [ "$(jq '[.[] | select(.RuleID == "evm-private-key")] | length' "$fx/leak.json")" -ne 2 ]; then
            echo "::error::self-test: evm-private-key must flag both fake keys"; exit 1
          fi
          gitleaks dir "$fx/clean" --config .gitleaks.toml --redact --no-banner --log-level error --exit-code 3
          echo "self-test passed: fake keys caught, plain addresses ignored"
      - name: Merge-commit self-test (a fake key added only in a merge resolution is caught)
        run: |
          set -euo pipefail
          repo="$(mktemp -d "$RUNNER_TEMP/gl-merge.XXXXXX")"
          g() { git -C "$repo" -c user.name=gl-selftest -c user.email=gl-selftest@example.invalid -c commit.gpgsign=false "$@"; }
          g init -q -b main
          printf 'endpoint = "base"\n' > "$repo/settings.env"
          g add settings.env
          g commit -q -m base
          g checkout -q -b left
          printf 'endpoint = "left"\n' > "$repo/settings.env"
          g commit -q -a -m left
          g checkout -q main
          printf 'endpoint = "right"\n' > "$repo/settings.env"
          g commit -q -a -m right
          if g merge -q left >/dev/null 2>&1; then echo "::error::fixture merge did not conflict"; exit 1; fi
          # Resolve the conflict and add a fake key: it exists only in the merge commit.
          fake="$(printf 'deadbeef%.0s' 1 2 3 4 5 6 7 8)"
          printf 'endpoint = "merged"\nPRIVATE_KEY=0x%s\n' "$fake" > "$repo/settings.env"
          g add settings.env
          g commit -q --no-edit
          merge="$(g rev-parse HEAD)"
          set +e
          gitleaks git "$repo" --config .gitleaks.toml --redact --no-banner --log-level error --exit-code 3 \
            --log-opts="--all --full-history --diff-merges=first-parent" \
            --report-format json --report-path "$repo.json"
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then echo "::error::a fake key added only in a merge resolution was not detected (exit $status)"; exit 1; fi
          if ! jq -e --arg c "$merge" 'any(.[]; .RuleID == "evm-private-key" and .Commit == $c)' "$repo.json" >/dev/null; then
            echo "::error::the finding is not attributed to the merge commit"; exit 1
          fi
          echo "merge self-test passed: the merge-only fake key was flagged in $merge (exit $status)"
      - name: Scan the full git history (all fetched refs, merge commits included)
        run: |
          set -euo pipefail
          # No inline `gitleaks:allow` and no .gitleaksignore: only .gitleaks.toml can allowlist.
          # --diff-merges=first-parent: content introduced only by a merge (e.g. a conflict
          # resolution) is part of the scanned patches; plain `git log -p` omits merge diffs.
          mkdir -p "$RUNNER_TEMP/no-gitleaksignore"
          gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="--all --full-history --diff-merges=first-parent" --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/no-gitleaksignore"
